version: "3.9"

# ──────────────────────────────────────────────────────────────────────────────
# AutoCheckMobile — production docker-compose
# Запуск: docker compose -f docker-compose.prod.yml up -d
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Nginx — обратный прокси + HTTPS ────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
      - ./frontend/dist:/usr/share/nginx/html:ro   # собранный React
    depends_on:
      - backend
    restart: unless-stopped

  # ── Certbot — SSL-сертификат Let's Encrypt ──────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    # Запускается вручную: docker compose run --rm certbot certonly ...
    entrypoint: /bin/sh -c "trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew; done"

  # ── Backend — FastAPI ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 2
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    # НЕ открываем порт наружу — только через nginx
    expose:
      - "8000"

  # ── Celery Worker — проверки в фоне ────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      celery -A worker.tasks.celery_app worker
      --loglevel=info
      --concurrency=2
      -Q default
    env_file: ./backend/.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Docker-in-Docker для чекеров
      - submission_files:/tmp/submissions
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-autocheckmobile}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB:       ${POSTGRES_DB:-autocheckmobile}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autocheckmobile}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    expose:
      - "5432"

  # ── Redis — очередь задач ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    restart: unless-stopped
    expose:
      - "6379"

volumes:
  pgdata:
  redisdata:
  certbot_www:
  certbot_conf:
  submission_files:
